name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Stockfish ARM64 Binary
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/libstockfish.so" ]; then
            echo "Downloading Stockfish ARM64 binary..."
            curl -L -o sf.tar.gz "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz"
            tar -xzf sf.tar.gz
            cp stockfish/stockfish-android-arm64-universal app/src/main/jniLibs/arm64-v8a/libstockfish.so
            rm -rf sf.tar.gz stockfish
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-ARM64-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
